# ===================================================================
# Gitea Configuration File for Raspberry Pi 5 - Smart School Git-Forge
# ===================================================================

APP_NAME = Школьный Git-форж «Умная Школа»
RUN_USER = git
WORK_PATH = /var/lib/gitea
RUN_MODE = prod

[repository]
ROOT = /var/lib/gitea/git/repositories
SCRIPT_TYPE = bash
DEFAULT_BRANCH = main
DISABLE_HTTP_GIT = false
MAX_CREATION_LIMIT = 50

[repository.local]
LOCAL_COPY_PATH = /tmp/gitea/local-repo

[repository.upload]
ENABLED = true
ALLOWED_TYPES = 
MAX_FILE_SIZE = 100
MAX_FILES = 10

[server]
PROTOCOL = http
DOMAIN = gitea.school.local
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://gitea.school.local:3000/
DISABLE_SSH = false
SSH_PORT = 2222
SSH_LISTEN_PORT = 2222
START_SSH_SERVER = true
BUILTIN_SSH_SERVER_USER = git
LFS_START_SERVER = true
LFS_CONTENT_PATH = /var/lib/gitea/data/lfs
OFFLINE_MODE = true

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5432
NAME = gitea
USER = gitea
PASSWD = gitea_secure_school_pass_2026
SCHEMA = public
SSL_MODE = disable
PATH = /var/lib/gitea/data/gitea.db
LOG_SQL = false

[indexer]
ISSUE_INDEXER_PATH = /var/lib/gitea/data/indexers/issues.bleve

[session]
PROVIDER = file
PROVIDER_CONFIG = /var/lib/gitea/data/sessions

[picture]
DISABLE_GRAVATAR = true
ENABLE_FEDERATED_AVATAR = false

[attachment]
ENABLED = true
PATH = /var/lib/gitea/data/attachments
MAX_SIZE = 50
MAX_FILES = 5

[time]
DEFAULT_UI_LOCATION = Asia/Almaty

[security]
INSTALL_LOCK = true
SECRET_KEY = CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_IN_PRODUCTION
INTERNAL_TOKEN = CHANGE_THIS_TO_INTERNAL_TOKEN_IN_PRODUCTION
PASSWORD_COMPLEXITY = lower,upper,digit
MIN_PASSWORD_LENGTH = 8
DISABLE_GIT_HOOKS = true

[service]
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = true
ENABLE_NOTIFY_MAIL = false
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true

[oauth2]
ENABLED = false

[mailer]
ENABLED = false

[log]
MODE = file
LEVEL = info
ROOT_PATH = /var/lib/gitea/log

[cron]
ENABLED = true
RUN_AT_START = false

[cron.archive_cleanup]
SCHEDULE = @every 24h

[cron.git_gc_repos]
SCHEDULE = @every 72h
