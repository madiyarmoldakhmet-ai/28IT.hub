# ===================================================================
# Production Gitea Configuration File - Raspberry Pi 5 (28IT.hub)
# ===================================================================

APP_NAME = Школьный Git-форж (28IT.hub)
RUN_USER = git
WORK_PATH = /var/lib/gitea
RUN_MODE = prod

[server]
PROTOCOL = http
DOMAIN = raspberrypi.local
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://raspberrypi.local:3000/
DISABLE_SSH = false
SSH_PORT = 2222
SSH_LISTEN_PORT = 2222
START_SSH_SERVER = true
BUILTIN_SSH_SERVER_USER = git
LFS_START_SERVER = true
LFS_CONTENT_PATH = /var/lib/gitea/data/lfs
OFFLINE_MODE = true

[database]
DB_TYPE = postgres
HOST = 127.0.0.1:5432
NAME = gitea
USER = gitea
PASSWD = %POSTGRES_GITEA_PASSWORD%
SCHEMA = public
SSL_MODE = disable
PATH = /var/lib/gitea/data/gitea.db
LOG_SQL = false

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_NOTIFY_MAIL = false
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true

[actions]
ENABLED = false

[webhook]
ALLOWED_HOST_LIST = *

[repository]
ROOT = /var/lib/gitea/git/repositories
SCRIPT_TYPE = bash
DEFAULT_BRANCH = main
DISABLE_HTTP_GIT = false
MAX_CREATION_LIMIT = 50
DEFAULT_PRIVATE = last

[attachment]
ENABLED = true
PATH = /var/lib/gitea/data/attachments
MAX_SIZE = 50
MAX_FILES = 5

[indexer]
ISSUE_INDEXER_PATH = /var/lib/gitea/data/indexers/issues.bleve

[session]
PROVIDER = file
PROVIDER_CONFIG = /var/lib/gitea/data/sessions

[picture]
DISABLE_GRAVATAR = true
ENABLE_FEDERATED_AVATAR = false

[security]
INSTALL_LOCK = true
SECRET_KEY = CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_IN_PRODUCTION
INTERNAL_TOKEN = CHANGE_THIS_TO_INTERNAL_TOKEN_IN_PRODUCTION
PASSWORD_COMPLEXITY = lower,upper,digit
MIN_PASSWORD_LENGTH = 8
DISABLE_GIT_HOOKS = true

[log]
MODE = file
LEVEL = info
ROOT_PATH = /var/log/gitea
